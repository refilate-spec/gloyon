<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Advanced Search UI</title>
    <!-- Tailwind CSS CDN Link -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <!-- Heading -->
        <h1 class="text-3xl font-extrabold bg-gradient-to-r from-sky-400 to-indigo-500 bg-clip-text text-transparent mb-2">
            Tailwind AI Search
        </h1>
        <p class="text-slate-400 mb-6 text-sm">
            Search components, utilities, and layouts instantly using Tailwind classes.
        </p>

        <!-- Search Input Box -->
        <div class="relative mb-6">
            <input type="text" placeholder="Type to search..." 
                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all">
            <button class="absolute right-2 top-2 bg-gradient-to-r from-sky-500 to-indigo-600 text-white px-4 py-2 rounded-lg font-semibold text-sm hover:opacity-90 transition-opacity">
                Search
            </button>
        </div>

        <!-- Result Card Example -->
        <div class="space-y-4">
            <div class="p-4 bg-slate-950/50 border border-slate-800/80 rounded-xl hover:border-slate-700 transition-colors">
                <h3 class="text-sky-400 font-semibold text-lg mb-1">Responsive Flexbox Layouts</h3>
                <p class="text-slate-300 text-sm mb-3">Learn how to build modern adaptive web pages using Tailwind's flex utilities.</p>
                <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-md uppercase tracking-wider">Development</span>
            </div>
        </div>
    </div>

</body>
</html>
