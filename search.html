<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced AI Search Engine</title>
    <!-- Tailwind CSS CDN for modern design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/ai-search.css">
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-6">

    <div class="search-container w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <h1 class="text-3xl font-extrabold bg-gradient-to-r from-sky-400 to-indigo-500 bg-clip-text text-transparent mb-2">
            AI Search Engine
        </h1>
        <p class="text-slate-400 mb-6 text-sm">
            Search through articles, documents, and components instantly.
        </p>
        
        <!-- Search Input Box -->
        <div class="search-box-wrapper relative mb-4 flex gap-2">
            <input type="text" id="search-input" placeholder="Type keywords (e.g., JavaScript, AI, CSS)..." autocomplete="off"
                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition-all">
            <button id="search-btn" class="bg-gradient-to-r from-sky-500 to-indigo-600 text-white px-6 py-3 rounded-xl font-semibold text-sm hover:opacity-90 transition-opacity">
                Search
            </button>
        </div>

        <!-- Filter Tags -->
        <div class="filter-tags flex gap-2 mb-6 flex-wrap">
            <button class="tag active bg-sky-500 text-slate-950 font-semibold px-4 py-1.5 rounded-full text-xs cursor-pointer transition-all" data-category="all">All</button>
            <button class="tag bg-slate-950 border border-slate-800 text-slate-400 px-4 py-1.5 rounded-full text-xs cursor-pointer hover:border-slate-700 transition-all" data-category="development">Development</button>
            <button class="tag bg-slate-950 border border-slate-800 text-slate-400 px-4 py-1.5 rounded-full text-xs cursor-pointer hover:border-slate-700 transition-all" data-category="design">Design</button>
            <button class="tag bg-slate-950 border border-slate-800 text-slate-400 px-4 py-1.5 rounded-full text-xs cursor-pointer hover:border-slate-700 transition-all" data-category="ai">AI & Tech</button>
        </div>

        <!-- Status / Results Count -->
        <div id="search-status" class="text-xs text-slate-500 mb-4"></div>

        <!-- Search Results Grid -->
        <div id="search-results" class="results-grid space-y-3"></div>
    </div>

    <!-- JavaScript Files -->
    <script src="assets/js/search-engine.js"></script>
    <script src="assets/js/search.js"></script>
</body>
</html>
